name: Dexterra
description: Dexterra was a mobile workforce management software startup that built a mobile application
  platform for managing and optimizing field/mobile operations. Backed by Canaan Partners along with New
  Enterprise Associates, Intel Capital, Motorola Solutions Venture Capital, and Mesirow Financial, the
  company raised roughly $108M across its rounds. Dexterra was acquired by Antenna Software in June 2009
  and no longer operates as an independent entity; it has no active developer program, public API, or
  developer portal. This profile is retained as a Canaan Partners portfolio lead for network completeness.
